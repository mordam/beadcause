<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <title>Beadcause · ledger</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="doc-body">
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="pulse"></span>
      <h1>Ledger</h1>
      <!-- No `⦿ observing` chip here, unlike the other four standing views, and it is
           an absence with a reason rather than an oversight. `OBSERVING` rides on
           /api/work, /api/prs, /api/admin and the poll — the payloads of the pages that
           can *act* on this Mac — and not on /api/spaces, which is all this page
           fetches besides its own rows. A chip needs a second request to say what it
           says, and the thing it warns you about is a button that might reach the wrong
           machine. There is no such button on a ledger: nothing here writes. -->
    </div>
    <div class="sheet-actions">
      <button id="hist-refresh" class="icon-btn" aria-label="Refresh">⟳</button>
    </div>
  </header>

  <!-- The four filters over the ledger — status, priority, who filed it, and a
       substring of the bead id — in the same collapsed line the inbox uses. All four
       live in the query string and nowhere else, which is what makes a narrowed ledger
       a link you can put on a home screen. Empty and `hidden` until history.js mounts
       the control into it, so a page that fails to load filtermenu.js shows a list with
       no filter bar rather than an empty box where one should be. -->
  <nav class="filters" id="hist-filters" hidden></nav>

  <main class="work pagescroll">
    <!-- The whole list, drawn by history.js. Everything below is replaced on every
         repaint, so nothing that has to survive one may live in here.

         `hist-list` rather than the `history` it was until bc-khoe.30.5. The id is shared
         with the pane this page became in public/index.html, where `#history` is the hash
         that names the view — and an element of that id there is a fragment target the
         browser would scroll into view on every arrival, undoing the scroll position
         panes.js had just restored. One id across the two documents, and it is the one
         that cannot collide. -->
    <div id="hist-list">
      <div class="empty">Reading the ledger…</div>
    </div>
  </main>

  <!-- Every error this page hits, sent back to the daemon as a P0 bead: an uncaught
       exception, a rejected promise, a failed fetch. Ahead of every other script,
       because it can only catch what loads after it — and it is purely additive, so a
       page that fails to load it behaves exactly as it did before. -->
  <script src="/report.js"></script>
  <!-- The beads that go round the brand dot while this page is fetching. Loaded on
       every page that has a dot to put them on, and driven from report.js's own count of
       what is in flight rather than from anything this view says. See public/orbit.js. -->
  <script src="/orbit.js"></script>
  <!-- Whether what you are looking at is current, and the banner that says when it is
       not. Loaded on every page with a top bar, because the state it reports is a page
       that has stopped repainting — which no page can report from inside its own render.
       Before stream.js, which stamps it on every answer. See public/freshness.js. -->
  <script src="/freshness.js"></script>
  <!-- The app menu — the mark in a gear at the left of the top bar, and everything the
       bar used to hold loose behind it: this page's own top-right buttons, Admin, and
       which of your lives every screen is about. Before the page's own script, because
       it *moves* those buttons rather than copying them: a page that wires one by id
       afterwards is still wiring the element the thumb lands on. See
       public/accountbar.js. -->
  <script src="/accountbar.js"></script>
  <!-- Which repo the ledger is of. Before history.js, which registers its rebuild on
       it and has nothing to ask the daemon about until the picker knows the answer:
       /api/history takes exactly one workspace, so "which workspaces am I looking at"
       is not a filter over the response here, it is the request. -->
  <script src="/spacebar.js"></script>
  <script src="/addspace.js"></script>
  <!-- What the URL hash means: a view, a card to open on Home, or nothing (bc-khoe.30.2).
       Before viewbar.js and app.js because both read the answer out of it rather than
       parsing the hash themselves, and a page that loaded them without it would have a
       row that cannot say which view it is on and a notification tap that throws. -->
  <script src="/hashroute.js"></script>
  <script src="/viewbar.js"></script>
  <!-- The app keeping itself in step with what was just deployed: reloads the page when
       a deploy moved public/, and drives the Android shell's own update when one
       rebuilt the APK. On every standing view, because the "Update app" button belongs to
       the app rather than to a screen — and after stream.js, whose events it listens on
       rather than opening a second parked poll of its own. -->
  <script src="/update.js"></script>
  <!-- The panel the filter bar is drawn in, shared with the inbox. Before history.js,
       which mounts its four groups into it on the way past — a page without this file
       still draws the ledger, and still narrows it to whatever the URL asked for; it
       just has no control to change it with. -->
  <script src="/filtermenu.js"></script>
  <script src="/history.js"></script>
  <!-- Every row is a link into the graph, and the drawer is what keeps this list —
       and, more to the point, your place four hundred rows down it — underneath the
       bead you opened. Without this file a tap is a full-page navigation and the way
       back is the top of the list again. -->
  <script src="/drawer.js"></script>
</body>
</html>
