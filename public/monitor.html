<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <title>Beadcause · advocates</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="doc-body">
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="pulse"></span>
      <h1>Advocates</h1>
      <!-- Filled in only on an observer instance — see OBSERVING in lib/config.js.
           It sits next to the title rather than in the actions, because it is a fact
           about which daemon this is, not a control. -->
      <span class="observing" id="observing" hidden>⦿ observing</span>
    </div>
    <div class="sheet-actions">
      <span class="mon-tally" id="tally"></span>
      <button id="refresh" class="icon-btn" aria-label="Refresh">⟳</button>
      <a href="/work" class="icon-btn" aria-label="Current sessions">◑</a>
      <a href="/" class="icon-btn" aria-label="Back to the inbox">✕</a>
    </div>
  </header>

  <main id="mon" class="work">
    <div class="empty">Asking every workspace…</div>
  </main>

  <script src="/monitor.js"></script>
</body>
</html>
