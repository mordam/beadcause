<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <!-- "& sessions" because this page absorbed /sessions, and every path that view had
       lands here: the title is what a bookmark of /sessions, the Android shell's
       history and a desktop tab all read as, and there is room for the second word in
       all three — which the bottom tab bar's 72px per label does not have.

       "space" leads it now, because that is what this page is: the details of the one
       space the picker has selected — its settings, its advocates, its sessions and
       what it is waiting on you for. The other two words stay, and stay in that order,
       so a bookmark made when the page was called something else still reads as the
       page it opens. -->
  <title>Beadcause · space — advocates &amp; sessions</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="doc-body">
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="pulse"></span>
      <!-- One word, and the space picker two elements along says which space. The page
           was called "Advocates"; it is the details of a space now, and the advocates
           are one of the four things it shows about it. Not "Space details" — the
           picker sits in this same bar and already reads "Personal", so the long form
           would spend a 360px phone's whole top row saying the noun twice. -->
      <h1>Space</h1>
      <!-- Filled in only on an observer instance — see OBSERVING in lib/config.js.
           It sits next to the title rather than in the actions, because it is a fact
           about which daemon this is, not a control. -->
      <span class="observing" id="observing" hidden>⦿ observing</span>
    </div>
    <div class="sheet-actions">
      <span class="mon-tally" id="tally"></span>
      <!-- The gear: the admin screen, from the page you were looking at when you
           decided something had to be stopped. An <a> rather than a button because it
           is a navigation and should long-press, middle-click and open in a tab like
           one. The Admin tab in the bottom bar stays — this is a second way in from
           the one page whose settings sit beside it, not a replacement for it. -->
      <a id="gear" class="icon-btn" href="/admin" aria-label="Admin — pause everything, terminals, sign out" title="Admin">⚙</a>
      <button id="refresh" class="icon-btn" aria-label="Refresh">⟳</button>
    </div>
  </header>

  <!-- Two mutually exclusive modes of this one page, not navigation: Advocates draws what
       the Mac is running, Mirror draws what the phone has open. They swap the two panes
       below and change no URL, which is why they are buttons with aria-pressed rather
       than links.

       This is the settled half of bc-3xb: the mirror stays a pane here rather than
       becoming a fifth tab in the bottom bar — it is a mode, and a bottom bar is a
       phone's furniture, which is the device a mirror of the phone means nothing on. The
       reasons are in the README ("The Mirror is a mode, not a fifth tab") and the tabbar.js
       header; do not add a Mirror tab without reading them.

       The unsettled half is the *look*, and it is the reason this comment names it: two
       rows of tabs sit on this screen — the bottom bar moves between pages, this pair
       swaps a pane — with nothing visual to say so. bc-stci restyles this pair as the
       segmented control it already is. `.mon-tabs` rather than a bare `.tabs` since
       bc-4aw, so that restyle has a selector to itself. -->
  <nav class="chip-row mon-tabs" id="mon-tabs" aria-label="Views">
    <button class="chip" data-tab="advocates" aria-pressed="true">Advocates</button>
    <button class="chip" data-tab="mirror" aria-pressed="false">Mirror<span class="tab-dot" id="mirror-dot" hidden></span></button>
  </nav>

  <main id="mon" class="work">
    <div class="empty">Asking every workspace…</div>
  </main>

  <section id="mirror" class="work" hidden>
    <div class="empty">Looking for a device…</div>
  </section>

  <!-- Before monitor.js, which reports through it on the way up. This page is the
       sessions view now, and a phone sitting on it should be followable from a screen
       with room — see the presence note at the foot of monitor.js for why a page that
       is also a mirror can safely publish itself. -->
  <!-- What this page already has, from the last time you were on it: the payload it
       boots from, and the reconciler that keeps a repaint from throwing away the DOM
       it did not need to touch. First of the shared files, because every page script
       below asks it for a warm list before it asks the daemon for a cold one. -->
  <script src="/warm.js"></script>
  <script src="/presence.js"></script>
  <script src="/tabbar.js"></script>
  <!-- Which repo the advocates and sessions on this page belong to. Before monitor.js,
       which registers its repaint on it. -->
  <script src="/spacebar.js"></script>
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/monitor.js"></script>
  <!-- Speaking into the box beside it instead of thumbing it. Before the page's
       own script, which asks it at boot — or at render — whether a microphone can
       work here at all; a page that drops it draws no mic rather than a dead one. -->
  <script src="/dictate.js"></script>
  <script src="/mirror.js"></script>
  <!-- The advocates' rows all point into the graph; the drawer keeps them here. -->
  <script src="/drawer.js"></script>
</body>
</html>
