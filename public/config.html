<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <!-- "config" rather than "settings", because the app has two things by that name and
       only one of them is this: /admin is the machine's — pause everything, the
       terminals, sign out — and this is one *space's*, which is what the picker in the
       bar above selects. The word is the one the chip this page came from used
       (bc-me2b), so a bookmark made in the day it existed reads as the same screen. -->
  <title>Beadcause · space config</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="doc-body">
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="pulse"></span>
      <h1>Config</h1>
      <!-- Filled in only on an observer instance — see OBSERVING in lib/config.js. This
           page has one, where the ledger next door deliberately does not, and the
           difference is that everything here is a button: what the chip warns you about
           is a press that would reach the wrong Mac. It rides on /api/space, which is
           the one request this page makes anyway. -->
      <span class="observing" id="observing" hidden>⦿ observing</span>
    </div>
    <div class="sheet-actions">
      <button id="refresh" class="icon-btn" aria-label="Refresh">⟳</button>
    </div>
  </header>

  <main class="work pagescroll">
    <!-- The selected space's settings and what each of its repos resolves to, drawn by
         config.js. Replaced whole on every repaint — every press on this card is a write
         and every write redraws — so nothing that has to survive one may live in here.
         That is why the half-typed Slack channel is held in `state` and not in the DOM. -->
    <div id="space">
      <div class="empty">Reading this space…</div>
    </div>
  </main>

  <!-- Every error this page hits, sent back to the daemon as a P0 bead: an uncaught
       exception, a rejected promise, a failed fetch. Ahead of every other script,
       because it can only catch what loads after it — and it is purely additive, so a
       page that fails to load it behaves exactly as it did before. -->
  <script src="/report.js"></script>
  <!-- Whether what you are looking at is current, and the banner that says when it is
       not. Loaded on every page with a top bar, because the state it reports is a page
       that has stopped repainting — which no page can report from inside its own render. -->
  <script src="/freshness.js"></script>
  <!-- The app menu — the mark in a gear at the left of the top bar, and everything the
       bar used to hold loose behind it: this page's own ⟳, Admin, and which of your
       lives every screen is about. Before the page's own script, because it *moves*
       those buttons rather than copying them: a page that wires one by id afterwards is
       still wiring the element the thumb lands on. See public/accountbar.js. -->
  <script src="/accountbar.js"></script>
  <!-- Which space this page is the config of. Before config.js, which registers its
       repaint on it and has nothing at all to ask the daemon until the picker knows the
       answer: /api/space takes exactly one space, so "which space am I looking at" is
       not a filter over the response here, it is the request. -->
  <script src="/spacebar.js"></script>
  <!-- Where this device is, so a screen with room can follow a phone onto it. `config`
       has been one of the views public/mirror.js can name since it was a chip on the
       console (bc-me2b); it is a page now, and this is what still reports it. -->
  <script src="/presence.js"></script>
  <script src="/viewbar.js"></script>
  <!-- The app keeping itself in step with what was just deployed: reloads the page when
       a deploy moved public/, and drives the Android shell's own update when one
       rebuilt the APK. On every standing view, because the "Update app" button belongs
       to the app rather than to a screen. -->
  <script src="/update.js"></script>
  <script src="/config.js"></script>
</body>
</html>
