<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <!-- "Releases" and not "Deploys", because a deploy is the *event* and this page is
       about the journey: a branch waiting to merge is on it before any deploy exists,
       and a merge that went live an hour ago is still on it afterwards. -->
  <title>Beadcause · releases</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="doc-body">
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="pulse"></span>
      <h1>Releases</h1>
      <!-- On an observer instance this page can still be read and nothing on it acts —
           there is no button here at all (Ship stays on the PR board). The chip is kept
           because /api/queues carries `observing` and a page that shows a deploy in
           flight had better say which Mac's deploy it is. -->
      <!-- `rel-observing` rather than the `observing` every other page calls this, and the
           id is shared with the pane this page also is in public/index.html. There it
           cannot be `observing`: monitor.html has one of those, and bc-khoe.4 folded it
           into that same document — where it keeps the bare name because this one gave it
           up. One id across the two documents, and it is the one that cannot collide. -->
      <span class="observing" id="rel-observing" hidden>⦿ observing</span>
    </div>
    <div class="sheet-actions">
      <button id="refresh" class="icon-btn" aria-label="Refresh">⟳</button>
    </div>
  </header>

  <main class="work pagescroll">
    <!-- Everything below is replaced on every repaint, so nothing that has to survive
         one may live in here.

         `rel-list` rather than the `releases` it was until bc-khoe.30.14. The id is shared
         with the pane this page became in public/index.html, where `#releases` is the hash
         that names the view — and an element of that id there is a fragment target the
         browser would scroll into view on every arrival, undoing the scroll position
         panes.js had just restored. One id across the two documents, and it is the one
         that cannot collide. -->
    <div id="rel-list">
      <div class="empty">Asking where everything is…</div>
    </div>
  </main>

  <!-- Every error this page hits, sent back to the daemon as a P0 bead. Ahead of every
       other script, because it can only catch what loads after it. -->
  <script src="/report.js"></script>
  <!-- The beads that go round the brand dot while this page is fetching. Loaded on
       every page that has a dot to put them on, and driven from report.js's own count of
       what is in flight rather than from anything this view says. See public/orbit.js. -->
  <script src="/orbit.js"></script>
  <!-- Whether what you are looking at is current, and the banner that says when it is
       not. Before stream.js, which stamps it on every answer. -->
  <script src="/freshness.js"></script>
  <!-- The app menu behind the mark in the top bar — this page's ⟳, Admin, and which of
       your lives every screen is about. Before the page's own script, because it *moves*
       the buttons rather than copying them. -->
  <script src="/accountbar.js"></script>
  <!-- What this page had last time, painted before anything has been asked for — and the
       background fill that leaves the *other* views warm behind this one. Before
       stream.js, which stamps the sequence it learns onto what is kept. -->
  <script src="/warm.js"></script>
  <!-- The delta stream. This page has two clocks and neither of them is a minute timer:
       a deploy in flight is watched on four seconds because its steps are a file being
       written on the Mac, and everything else waits to be woken. See public/releases.js. -->
  <script src="/stream.js"></script>
  <!-- What the URL hash means: a view, a card to open on Home, or nothing (bc-khoe.30.2).
       Before viewbar.js, which reads the answer out of it rather than parsing the hash
       itself — and it is where this page's own three addresses are declared, so without
       it the row could not say that Releases is the view it is on. -->
  <script src="/hashroute.js"></script>
  <script src="/viewbar.js"></script>
  <!-- Which repos this page is about. The queues come back keyed by repo and the picker
       is what narrows them — a Climative account naming three of forty draws three. -->
  <script src="/spacebar.js"></script>
  <script src="/addspace.js"></script>
  <!-- The app keeping itself in step with what was just deployed. On every standing view,
       and more obviously earned here than anywhere else: this is the page you are looking
       at while the thing that replaces it is being built. -->
  <script src="/update.js"></script>
  <!-- `esc`, `plural`, `ago` and `graphUrl`, which the board and the inbox already share.
       This page draws no pull request row, so it borrows the four small ones only —
       loaded before releases.js, which takes them apart at the top. -->
  <script src="/prcard.js"></script>
  <script src="/releases.js"></script>
  <!-- A bead pill on a card is a link into the graph, and the drawer is what keeps this
       page — and your place in it — underneath the bead you opened. -->
  <script src="/drawer.js"></script>
</body>
</html>
