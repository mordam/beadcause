<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <title>Beadcause · current sessions</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="doc-body">
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="pulse"></span>
      <h1>Current sessions</h1>
      <!-- Only on an observer instance — see OBSERVING in lib/config.js. -->
      <span class="observing" id="observing" hidden>⦿ observing</span>
    </div>
    <div class="sheet-actions">
      <!-- ⟳ acts on this view, so it stays. The link to the advocates and the ✕
           back to the inbox were both this page apologising for not being part of
           anything; the tab bar is where you go now. -->
      <button id="work-refresh" class="icon-btn" aria-label="Refresh">⟳</button>
    </div>
  </header>

  <main id="work" class="work">
    <div class="empty">Asking every workspace…</div>
  </main>

  <script src="/presence.js"></script>
  <script src="/tabbar.js"></script>
  <script src="/work.js"></script>
  <!-- Every row here is a link into the graph; the drawer keeps them over this list. -->
  <script src="/drawer.js"></script>
</body>
</html>
