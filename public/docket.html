<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <title>Beadcause · the docket</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="doc-body">
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="pulse"></span>
      <h1 id="arc-title">Loading…</h1>
    </div>
    <button id="arc-close" class="icon-btn" data-drawer-close aria-label="Close tab">✕</button>
  </header>

  <main id="docket" class="doc pagescroll">
    <div class="empty">Reading the tracker…</div>
  </main>

  <!-- Every error this page hits, sent back to the daemon as a P0 bead. Ahead of every
       other script, because it can only catch what loads after it. -->
  <script src="/report.js"></script>
  <script src="/orbit.js"></script>
  <script src="/freshness.js"></script>
  <script src="/accountbar.js"></script>
  <script src="/presence.js"></script>
  <!-- The other half of the drawer, exactly as /graph, /doc and /bead-session load it:
       in a panel this page puts its top bar away and hands its name up, and its ✕
       dismisses the drawer. Opened on its own it installs nothing at all.

       No dictate.js and no submitqueue.js, unlike a card: there is nothing on this page
       to write with. A docket is the record, and every control on it is a link or a
       fold. -->
  <script src="/docket.js"></script>
  <script src="/drawer.js"></script>
</body>
</html>
