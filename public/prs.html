<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <title>Beadcause · pull requests</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="doc-body">
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="pulse"></span>
      <h1>Pull requests</h1>
      <!-- Only on an observer instance — see OBSERVING in lib/config.js. An observer
           can still merge, because merging happens at GitHub; it cannot ship, because
           shipping opens a window on the Mac this daemon is not running on. -->
      <span class="observing" id="observing" hidden>⦿ observing</span>
    </div>
    <div class="sheet-actions">
      <button id="prs-refresh" class="icon-btn" aria-label="Refresh">⟳</button>
    </div>
  </header>

  <main id="prs" class="work">
    <div class="empty">Asking every repo…</div>
  </main>

  <!-- Every error this page hits, sent back to the daemon as a P0 bead: an uncaught
       exception, a rejected promise, a failed fetch, any red toast. Ahead of every
       other script, because it can only catch what loads after it — and it is purely
       additive, so a page that fails to load it behaves exactly as it did before. -->
  <script src="/report.js"></script>
  <!-- What this page already has, from the last time you were on it: the payload it
       boots from, and the reconciler that keeps a repaint from throwing away the DOM
       it did not need to touch. First of the shared files a page draws with, because
       every page script below asks it for a warm list before it asks the daemon for a
       cold one. -->
  <script src="/warm.js"></script>
  <!-- The delta stream: one long poll on /api/poll, so this page learns what moved
       instead of re-asking for everything on a clock. Beside warm.js because the two
       are the same bargain at the two ends of a visit — one paints what you already
       had, the other keeps it true. -->
  <script src="/stream.js"></script>
  <script src="/presence.js"></script>
  <script src="/tabbar.js"></script>
  <!-- Which repo the board is about. Before prs.js, which registers its repaint on it. -->
  <script src="/spacebar.js"></script>
  <!-- Speaking into the box beside it instead of thumbing it. Before the page's
       own script, which asks it at boot — or at render — whether a microphone can
       work here at all; a page that drops it draws no mic rather than a dead one. -->
  <script src="/dictate.js"></script>
  <!-- The row, the lamps and the status ladder — shared with the cards the inbox draws
       for the same pull requests. Before prs.js, which takes them apart at the top of
       its own IIFE and has no board to draw without them. -->
  <script src="/prcard.js"></script>
  <script src="/prs.js"></script>
  <!-- Every bead pill here is a link into the graph; the drawer keeps them over this list. -->
  <script src="/drawer.js"></script>
</body>
</html>
