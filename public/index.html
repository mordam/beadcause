<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    interactive-widget=resizes-content is what keeps the pinned answer box above the
    on-screen keyboard. An open card is `position: fixed; inset: 0` with the composer
    as its last row, so the composer sits on the bottom of the *layout* viewport —
    and a browser's default (resizes-visual) leaves that viewport at full height and
    slides the keyboard over it. The Android app never had the problem: its activity
    is windowSoftInputMode="adjustResize", which is the same bargain natively.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Beadcause">
  <title>Beadcause</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="pulse"></span>
      <!-- The mark, not the word. The phone already says "Beadcause" on the home
           screen, in the PWA title and in the switcher; spelling it out a fourth time
           spent the widest part of the bar on the one thing you cannot be unsure of.
           It stays an <h1> with the name as the image's alt text, so the header is
           still labelled and a reader still hears which app this is.

           It is also the way into the app's menu now (bc-khoe.5). What wraps it in a
           gear and makes it the trigger is accountbar.js, at runtime, on every page —
           this markup is the mark and nothing else on purpose, because eleven other
           pages draw a title here instead and the button has to be the same control on
           all twelve. -->
      <h1 class="mark"><img src="/icon.svg" alt="Beadcause" width="26" height="26" decoding="async"></h1>
      <!-- An "N waiting" pill used to sit beside the mark, counting the beads asking
           you something. It is gone (bc-ka5y.1): the list under it is that number, so
           the pill spent the widest part of the bar restating what you were already
           looking at. Its tap was a shortcut to the `human` scope, which the scope
           chips in the filter panel still are. -->
    </div>
    <div class="sheet-actions">
      <!-- Nothing is drawn here any more, and that is the point: every button below is
           moved into the mark's menu at load by accountbar.js, and this row is left
           empty rather than deleted because the nodes are *moved*, so a page script
           still wires the element the thumb lands on (and the monitor puts a tally back
           into its own copy of this row on every poll).

           The chat session, the sessions and the advocates used to hang here. They are
           tabs now — the bar at the foot of every page owns them, so they are one
           tap from anywhere rather than one tap from the inbox. ⟳ was the last one to
           stay loose, and bc-khoe.5 took it in with the rest: the bar is one row now,
           shared with the space picker, and a single icon floating between the mark and
           the picker is the shape that was being got rid of. Refresh costs two taps.

           The terminal (⌨️) used to hang here too and does not any more (bc-l8jp.2):
           it is the least-opened surface in the app and this is the most-opened
           screen, so it moved to the one page that is already about the daemon
           rather than about beads — see the terminal card on public/admin.html.
           Nothing about the terminal itself moved: /terminal still answers, so a
           bookmark or a home-screen shortcut pointed at it is untouched, and a
           card's ⌨️ menu item still opens one seeded on that bead (menuHtml in
           app.js), which is how a terminal is usually reached from here anyway —
           with the bead already in it.

           Naming that file bare, without its `public/` prefix, is not a slip: the
           wiring check in test/inboxkinds.mjs locates the script tags in this document
           with indexOf, so a slash-prefixed script name anywhere above them — in prose
           as much as in markup — reads as that script loading first, and fails the
           suite. Every comment in this file that names one drops the slash for that
           reason. -->

      <!-- There was a 🗳️ here, and it was a door to the endorsement queue. It is gone
           (bc-w156), and what removed it is not a tidy-up: the beads it led to are in the
           inbox now — under the Questions pill since bc-khoe.2, having had a chip of
           their own before that — and a door in the chrome to a list the inbox is already
           carrying is a fifth place to look for something that is in front of you. See
           the kinds table in inboxfilter.js.

           Worth keeping the old argument for the badge that was refused, because it is
           what the replacement had to beat: a count here would have cost a
           `bd list --label unendorsed` per workspace on every thirty-second poll, where
           the inbox's counts are free by-products of a sweep the poller already makes.
           The count is free in exactly that way — a held bead is already in the
           agent sweep, and all that was added was a label test on a row in hand.

           The page itself is still there and still reachable: the `N held for endorsement`
           pill on the advocate console links to it, and so does every held card in the
           inbox. What it stopped being is a destination in the chrome. -->
      <!-- The badge is the channel's presence in the chrome: a request never appears
           in the list below, so without this the only sign one is waiting would be a
           notification you may have already swiped away. -->
      <a href="/foundations" class="icon-btn" id="foundations-link" aria-label="Foundations — what each agent kind is, and what it may do">⚖️<span class="badge" id="req-badge" hidden></span></a>
      <!-- The way out to a real browser, and the only one there is: a link to our own
           host is kept inside the app's WebView on purpose, so nothing short of the
           native bridge can leave. Hidden unless that bridge is on the page — in a
           browser you are already in one, and an APK built before this existed has no
           `openInBrowser` to call. See the Bridge in MainActivity.kt. -->
      <button id="open-chrome" class="icon-btn" hidden aria-label="Open this page in Chrome">🌐</button>
      <button id="refresh" class="icon-btn" aria-label="Refresh">⟳</button>
    </div>
  </header>

  <!--
    Home, as a pane of the shell rather than as the document everything else departs from
    (bc-khoe.30.3).

    Everything below is what this page has always held; what is new is the container
    around it and the two empty ones under it, one per view. Which pane is shown is a
    fact about the URL hash and nothing else — see panes.js, which reads the answer out
    of hashroute.js and swaps a `display: none` for it.

    The three floating things are **inside** the pane on purpose. ＋, ✏️ and the scroll
    position are `position: fixed`, so none of them is laid out by this container at all
    — but a fixed element inside a `display: none` ancestor is not painted either, which
    is the whole reason they are in here: they belong to Home, and a ＋ that went on
    hovering over the History pane would be a create with nothing behind it. The toast
    and the token dialog stay outside, because both are the app talking rather than this
    view.
  -->
  <div class="pane" data-pane="epics">
    <!--
      The inbox's own filter, in two halves that share one row.

      In front: the **scope** — Human, Both, Agent — as a segmented switch on the chrome
      (public/filterpills.js, bc-khoe.24). It decides which sweep runs, so it decides what
      Home is able to contain at all, and it is the one control here that must never be
      behind anything.

      Behind it: what is left of the collapsed panel — which bead, and which rung within
      the pill you are on. Built by public/inboxfilter.js: one line at rest saying what is
      selected, the chips on hover with a pointer and on a tap without one.

      It held three permanent rows once, coarsest first: the scope, then the space, then
      the workspace. The bottom two are the space picker in the top bar now. The **kinds**
      were in here too, as ten chips, and bc-khoe.2 promoted them out to the pill row above
      — ten categories of incoming thing is a navigation rather than a filter, and a
      navigation you have to open something to see is one nobody uses. bc-khoe.26 is what
      takes the rest of the panel apart the same way.
    -->
    <nav class="filters" id="filters" hidden></nav>

    <main id="list" class="list pagescroll" aria-live="polite">
      <div class="empty" id="loading">Loading questions…</div>
    </main>

    <!--
      Where you are in the list — "4 of 11" and a rail. Filled in by paintScrollPos()
      in app.js, which is also what shows and hides it.

      aria-hidden on purpose: a screen reader already walks the list item by item and
      knows the position, and a live region re-announcing it on every scroll tick would
      make the app unusable to listen to.
    -->
    <div id="scrollpos" class="scrollpos" hidden aria-hidden="true"></div>

    <!--
      ＋ — the one thing on this screen that creates rather than answers.

      It is here because Chat stopped being a tab (bc-l8jp.5). That tab was two jobs at
      one address: the conversations you had already started, which are rows in the list
      above now, and the way to start another, which is this. A tab could not be the
      second of those — the bar is the same on five pages and "create" does not mean the
      same thing on all five — so the create moved to the view it belongs to.

      Bottom right, above the tab bar, because that is where a thumb is: the top bar is
      the far corner of a phone and this is the app's primary action. It floats over the
      list, and the list pays for it — `body.has-compose` adds the button's height to the
      padding at the foot of #list, so the last card still clears everything above the
      bar. What it must not cover is an open card, which is a fixed full-screen layer at
      z-index 40; ＋ sits below that on purpose (see .compose in style.css).

      The panel above it is for the one case ＋ cannot answer on its own: with more than
      one repo in the selected space there is no single place to start, so it asks
      instead of guessing or going dead. Same control the chat launcher grew for the
      same reason, and it borrows its .ws-pick styling.

      All three are in the markup on every load and none is drawn on every kind: ＋ belongs
      to the view now (bc-khoe.27.1), so the wrapper is hidden — along with `has-compose`,
      and along with both panels — on Questions and PRs, which have nothing to create. What
      it *makes* belongs to the view too (bc-khoe.27.2), so the label and the `aria-controls`
      below are the chat's — the fallback for a page whose filter script never loaded — and
      are repainted per kind. See `paintCompose` in app.js and `compose` in inboxfilter.js.
      (Written without the
      leading slash on purpose: some suites find the script tags at the foot of this file
      by searching for a bare slash-and-filename, so a comment up here that spells one out
      that way silently moves their answer. Two were fixed on bc-khoe.27.1 to match the
      tag; test/stream.mjs still asks the loose way, for every standing page at once.)
    -->
    <div class="compose-wrap">
      <!--
        The other panel, and the reason ＋ needed a second one (bc-khoe.27.2). On My Epics
        the create is not a chat: it is one of the beads you own that you have not started
        yet, going onto the board. Those candidates used to be a picker at the foot of the
        board itself, opened by a ＋ Start an epic button sitting under the cards; the
        button was where the list was, which is the far end of a scroller from the thumb,
        and the board is *above* the inbox list so opening it grew the page under whatever
        you were reading. Up here it grows nothing — the wrapper is fixed — so the tap has
        no scroll to protect at all, which is the acceptance criterion falling out of the
        move rather than being defended.

        Two panels rather than one with its contents swapped: each keeps its own heading
        for a screen reader, and ＋ points `aria-controls` at whichever one its kind opens.
        The rows inside are the board's own `.p0-cand` shape, drawn by the same function
        that drew them at the foot of the board, so the two-line candidate — id and count,
        then title — is one renderer and not two.
      -->
      <div id="compose-epics" class="compose-pick ws-pick epics" hidden>
        <h2 class="section-label">Start an epic</h2>
        <div id="compose-epics-row" class="p0-picker"></div>
      </div>
      <div id="compose-pick" class="compose-pick ws-pick" hidden>
        <h2 class="section-label">Start one in</h2>
        <div id="compose-pick-row" class="chip-row"></div>
      </div>
      <button id="compose" class="compose" aria-expanded="false" aria-controls="compose-pick"
        aria-label="Start a chat session — talk through what the next bead should be">＋</button>
    </div>


    <!--
      The create form ＋ opens on All Beads (bc-khoe.27.3).

      ＋ means *new*, and what new is belongs to the view rather than to the button. On
      Chats it starts a conversation; on this screen — every live bead in the tracker —
      it files one, and this is the form. It is a sheet rather than a page because the
      list behind it is the reason you are filing: you tapped ＋ while looking at what is
      already there, and a navigation away and back would cost you that.

      **Parent is the field this form exists to have.** A bead with nothing decided above
      it is not workable (bc-rfnr.7) and is drawn on no screen either, so a create that
      quietly made orphans would be a button for filing beads nobody will ever see. Blank
      is not "no parent": the daemon asks lib/homing.js, exactly as it does for every bead
      an agent files, and lands it under the repo's `unsorted` root. The placeholder says
      so, because a field whose empty case does something has to admit it.

      **Which repo is the same question ＋ already answers for a chat**, and it is answered
      the same way: `space.inside()` is what the picker in the top bar allows. One
      candidate is stated rather than asked about; more than one is a row of chips, since a
      form that filed into a repo you are not looking at is the one thing the picker exists
      to stop.

      Everything else — the fields, their order, the chip rows for type and priority — is
      the chat console's proposal sheet, which has edited exactly these fields on a phone
      since bc-l8jp. Same classes, same stylesheet, on purpose: two editors for one bead
      shape that drifted apart would be two answers to "what is a bead" with nothing
      saying which is right.
    -->
    <section id="beadform" class="sheet beadform" hidden role="dialog" aria-modal="true"
      aria-label="File a new bead">
      <div class="sheet-grip"></div>
      <header class="sheet-head">
        <strong class="beadform-head">New bead</strong>
        <div class="sheet-actions">
          <button id="beadform-close" class="icon-btn" type="button" aria-label="Close without filing">✕</button>
        </div>
      </header>
      <form id="beadform-form" class="sheet-body">
        <div class="field" id="beadform-ws-field">
          <span>Workspace</span>
          <div id="beadform-ws" class="chip-row"></div>
        </div>

        <label class="field">
          <span>Title</span>
          <textarea rows="2" id="beadform-title" required
            placeholder="One line: what needs doing."></textarea>
        </label>
        <div class="field">
          <span>Type</span>
          <div id="beadform-type" class="chip-row"></div>
        </div>

        <div class="field">
          <span>Priority</span>
          <div id="beadform-priority" class="chip-row"></div>
        </div>

        <label class="field">
          <span>Description</span>
          <textarea rows="4" id="beadform-description"
            placeholder="Why this exists and what needs doing."></textarea>
        </label>

        <label class="field">
          <span>Acceptance</span>
          <textarea rows="2" id="beadform-acceptance"
            placeholder="How we would know it is done."></textarea>
        </label>

        <label class="field">
          <span>Parent</span>
          <input type="text" id="beadform-parent" autocapitalize="none" autocorrect="off"
            spellcheck="false" placeholder="a bead id — blank files it under the unsorted root">
        </label>

        <label class="field">
          <span>Labels</span>
          <input type="text" id="beadform-labels" autocapitalize="none" autocorrect="off"
            placeholder="comma, separated">
        </label>

        <p id="beadform-say" class="beadform-say" hidden></p>

        <div class="beadform-actions">
          <button type="button" id="beadform-cancel" class="secondary">Cancel</button>
          <button type="submit" id="beadform-file" class="primary">File it</button>
        </div>
      </form>
    </section>
    <!--
      ✏️ — the one thing on this screen that changes the screen rather than the tracker.

      Edit mode freezes the repaints and turns a tap into a way of pointing at an element
      instead of opening it (bc-p49x.1). It is a button in the page rather than an icon in
      the top bar, and it stays one now that the bar has room: the bar was full at four
      icons and a fifth wrapped it to three rows on both phone widths (bc-qsj6.1), and
      bc-khoe.5 emptied it by moving every one of those into the mark's menu. That is the
      one place this control cannot go — edit mode freezes the screen, so a tap opens
      nothing, and a way *into* the mode behind a tap-to-open menu would be reachable and a
      way *out* of it would not. Bottom left, mirroring ＋ across the foot of the screen — the other thumb,
      the same height, and the same z-index bargain: it floats over the list and sits below
      an open card, which is a fixed layer above both.

      It is the way out as well as the way in. In edit mode it goes filled and its label
      becomes "Leave edit mode", and the banner across the top carries a Done beside it —
      two ways out of a mode where an ordinary tap no longer does what it used to.
    -->
    <button id="editmode" class="editmode" type="button" aria-pressed="false"
      aria-label="Edit this screen">✏️</button>
  </div>

  <!--
    The ledger — every bead this space has ever had, most recently touched first, and a
    pane of this document rather than the separate `/history` it used to be (bc-khoe.30.5).

    The markup is history.html's, unchanged, minus the top bar and the pill row that page
    drew for itself: the shell above already has both, which is most of the point. What
    fills it is public/history.js, the same file that page loads, which registers with the
    stager and builds this container when asked. `/history` is still a document and still
    answers — a home-screen shortcut to it must keep working until bc-khoe.30.7 lands it
    here — so that file has to run in either, and it decides which by asking whether this
    document has panes.

    `id="hist-list"` rather than the `id="history"` it was, and the rename is not
    cosmetic: the hash that names this view is `#history`, and an element of that id in
    the same document is a **fragment target**. A browser asked to go to `#history` scrolls
    it into view, which on the pane you are returning to is the scroll position panes.js
    just restored, thrown away by the URL.
  -->
  <div class="pane" data-pane="history" hidden>
    <!-- The four filters over the ledger — status, priority, who filed it, and a
         substring of the bead id — in the same pills the inbox uses. Its own mount of
         public/filtermenu.js rather than a share of Home's: the control holds which of
         its pills is open and nothing else, so two panes each drawing four filters are
         two instances, and a shared one would open History's status panel on the inbox.

         All four live in the hash, as `#history?status=closed&priority=P0` — see decision
         5 in public/hashroute.js. On the page this was they lived in the query string,
         which is where the ledger's filters have always been written; in one document
         that string outlives the view that wrote it, and Home is not the place to keep
         History's filter. -->
    <nav class="filters" id="hist-filters" hidden></nav>

    <main class="work pagescroll">
      <!-- The whole list, drawn by history.js. Everything in here is replaced on every
           repaint, so nothing that has to survive one may live in it. -->
      <div id="hist-list">
        <div class="empty">Reading the ledger…</div>
      </div>
    </main>
  </div>

  <!--
    The last view still a container with nothing in it.

    `data-pending` names the bead that fills it, and it is load-bearing rather than a note:
    panes.js refuses to show a pane carrying one and the pill row asks it the same
    question, so Advocates stays an ordinary `<a href>` link to the document it still is.
    That is what let the shell land on its own — the alternative was pills leading to a
    blank screen on an app that deploys itself the moment a branch merges. The bead
    deletes the attribute by filling the container, which is what the pane above just did.

    Advocates names **bc-khoe.4** rather than bc-khoe.30.6, and the swap is a sequencing
    fact rather than a rename (bc-khoe.30.6). This container is the advocate console —
    monitor.html's chip row and all four of its sections, which is monitor.js, prs.js,
    mirror.js and montabs.js in one pane — and one of those four sections is *leaving*:
    bc-khoe.10 takes the space's settings out to a view of their own. Filling this
    container before that lands would mean folding in a Config pane already deleted on
    another branch, so the fold is bc-khoe.4's, behind bc-khoe.10, and bc-khoe.30.6 is
    the bead that decided that and wrote down the two rulings the fold needs. See
    "The advocate console is one pane, and its chip row stays" in README.md.
  -->
  <div class="pane" data-pane="advocates" data-pending="bc-khoe.4" hidden></div>

  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="setup" class="setup">
    <form method="dialog">
      <h2>Access token</h2>
      <p>Open this app from the link the server printed, or paste the token from
        <code>~/.config/beadcause/config.json</code>.</p>
      <input id="token-input" type="password" autocomplete="off" placeholder="token" inputmode="text">
      <button value="save" class="primary">Save</button>
    </form>
  </dialog>

  <!-- Every error this page hits, sent back to the daemon as a P0 bead: an uncaught
       exception, a rejected promise, a failed fetch, any red toast. Ahead of every
       other script, because it can only catch what loads after it — and it is purely
       additive, so a page that fails to load it behaves exactly as it did before. -->
  <script src="/report.js"></script>
  <!-- The beads that go round the brand dot while this page is fetching. Loaded on
       every page that has a dot to put them on, and driven from report.js's own count of
       what is in flight rather than from anything this view says. See public/orbit.js. -->
  <script src="/orbit.js"></script>
  <!-- Whether what you are looking at is current, and the banner that says when it is
       not. Loaded on every page with a top bar, because the state it reports is a page
       that has stopped repainting — which no page can report from inside its own render.
       Before stream.js, which stamps it on every answer. See public/freshness.js. -->
  <script src="/freshness.js"></script>
  <!-- The app menu — the mark in a gear at the left of the top bar, and everything the
       bar used to hold loose behind it: this page's own top-right buttons, Admin, and
       which of your lives every screen is about. Before the page's own script, because
       it *moves* those buttons rather than copying them: a page that wires one by id
       afterwards is still wiring the element the thumb lands on. See
       public/accountbar.js. -->
  <script src="/accountbar.js"></script>
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <!-- What this page already has, from the last time you were on it: the payload it
       boots from, and the reconciler that keeps a repaint from throwing away the DOM
       it did not need to touch. First of the shared files a page draws with, because
       every page script below asks it for a warm list before it asks the daemon for a
       cold one. -->
  <script src="/warm.js"></script>
  <!-- The delta stream: one long poll on /api/poll, so this page learns what moved
       instead of re-asking for everything on a clock. Beside warm.js because the two
       are the same bargain at the two ends of a visit — one paints what you already
       had, the other keeps it true — and before every page script, all of which mount
       it. -->
  <script src="/stream.js"></script>
  <script src="/presence.js"></script>
  <!-- What the URL hash means: a view, a card to open on Home, or nothing (bc-khoe.30.2).
       Before viewbar.js and app.js because both read the answer out of it rather than
       parsing the hash themselves, and a page that loaded them without it would have a
       row that cannot say which view it is on and a notification tap that throws. -->
  <script src="/hashroute.js"></script>
  <!-- The panes above, and which of them the hash is showing (bc-khoe.30.3). After
       hashroute.js, whose answer it acts on, and **before** viewbar.js, which asks it
       whether a pill's view is a pane of this document before deciding whether that pill
       is a link or a control. This is the one page that loads it: the row is drawn on
       twelve and only this one has panes to swap, which is why the row reaches for it
       with `?.` and for the grammar flat. See panes.js. -->
  <script src="/panes.js"></script>
  <!-- What goes *in* those panes, and when (bc-khoe.30.4). After panes.js, whose `onShow`
       it hangs the safety net on and whose `showing()` is what "the view you landed on"
       means; before every pane's own script, because each of them registers its builder
       with this file as it loads and the staged pass runs once they all have. A page
       without it is a page whose scripts build themselves at load, which is what they all
       did before — the register call answers false and each falls back. Named bare, with
       no leading slash, for the reason every other comment in this file is: the wiring
       check in test/inboxkinds.mjs finds script tags with indexOf, and panestage.js
       spelled the other way up here would move its answer. -->
  <script src="/panestage.js"></script>
  <script src="/viewbar.js"></script>
  <!-- The app keeping itself in step with what was just deployed: reloads the page when
       a deploy moved public/, and drives the Android shell's own update when one
       rebuilt the APK. On every standing view, because the "Update app" button belongs to
       the app rather than to a screen — and after stream.js, whose events it listens on
       rather than opening a second parked poll of its own. -->
  <script src="/update.js"></script>
  <!-- The space picker in the top bar — which repo the whole app is about. Before
       app.js, because app.js registers its repaint on it at the top of its own IIFE;
       and it is what the two chip rows that used to be in #filters became, so the list
       below is filtered by the bar above it rather than by a row of its own. -->
  <script src="/spacebar.js"></script>
  <!-- One pull request, drawn once, for the two screens that draw them — this list and
       the board at /prs. Before the filter, which reads the status ladder off it to
       build the sub-filter's chips, and therefore before app.js too. -->
  <script src="/prcard.js"></script>
  <!-- The panel the filter lives in — the collapsed line, the chips, and the open-and-
       close state machine, shared with the History tab's own filter bar. Before
       inboxfilter.js, which mounts it rather than drawing one: without this file the
       inbox has no control on it at all. -->
  <script src="/filtermenu.js"></script>
  <!-- The ledger pane. After filtermenu.js, which it mounts its four filters into, and
       after spacebar.js, whose selection *is* its request rather than a filter over the
       answer. It registers with the stager above and builds when asked, so on a load that
       lands on Home it costs one script parse and no request at all. Its position among
       the page scripts is otherwise free: the stager decides the order panes are built
       in, not this file. See public/history.js. -->
  <script src="/history.js"></script>
  <!-- The other half of that pair: the filters that are *not* behind a collapsed line,
       drawn flat in the same row (bc-khoe.24). The scope switch is the one tenant today
       and bc-khoe.26 moves the rest out here beside it. Before app.js, which hands it
       the scope group as it boots; a page that drops this file keeps the panel and loses
       the switch rather than losing the filter. -->
  <script src="/filterpills.js"></script>
  <!-- The kinds table, and the scope and sub-filters behind one collapsed line. Before
       app.js, because app.js hands it the scope group and asks it whether each row is in
       view as it renders — and a page that drops it falls back to the unfiltered list
       rather than to no list. **After viewbar.js**, which draws the pill row the kinds
       are now: this file pushes the lit pill at that one through
       `window.beadcause.views.mark`, at load, so the row has to exist by then. -->
  <script src="/inboxfilter.js"></script>
  <!-- The answer collapsing into beads and the beads going into the mark. Before
       app.js because submit() reaches for it on the tap; it registers itself on
       `beadcause` and touches nothing else, so a page that drops it still answers
       questions — just without the flight. -->
  <script src="/absorb.js"></script>
  <!-- What holds the writes those beads are covering. Before app.js and for the same
       reason absorb.js is: submit() asks for it as the IIFE runs and hands it every
       write from the tap onward. A page that drops it still answers questions — the
       fallback in app.js sends each one straight out instead of queueing it, which is
       what every build before this one did. -->
  <script src="/submitqueue.js"></script>
  <!-- Speaking an answer instead of thumbing it. Before app.js, and for the same
       reason absorb.js is: the answer box asks it at render time whether a
       microphone can work here at all, and a page that drops it draws the box with
       no mic in it rather than one that fails on tap. -->
  <script src="/dictate.js"></script>
  <!-- Edit mode: the freeze, and the anchor that turns an element into a line of this
       app's own source. Before app.js because app.js registers on it at the top of its
       IIFE — it asks it whether a repaint may happen and hands it the payload text it is
       drawing — and a page that drops the file gets the inbox exactly as it was, with a
       ✏️ that does nothing rather than a screen that will not paint. Named without its
       leading slash for the reason every other comment in this file is: the wiring check
       in test/inboxkinds.mjs finds script tags with indexOf. -->
  <script src="/editmode.js"></script>
  <script src="/app.js"></script>
  <!-- Graph and doc links open over this tab instead of navigating away from it.
       Last, and needing nothing from app.js: it works on the anchors, not the app. -->
  <script src="/drawer.js"></script>
</body>
</html>
