<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Beadcause">
  <title>Beadcause</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- Top left, ahead of the title: the scope it opens decides what the whole
           list below means, so it reads first rather than last. -->
      <button id="settings" class="icon-btn" aria-label="Settings — what the inbox shows" aria-haspopup="dialog">⚙</button>
      <span class="dot" id="pulse"></span>
      <h1>Beadcause</h1>
    </div>
    <div class="sheet-actions">
      <!-- A link, not a button: /sessions is its own page, so the inbox needs no JS
           for it and nothing here can go stale with the view. -->
      <!-- The only way into the app that adds work rather than acting on it. -->
      <a href="/console" class="icon-btn" aria-label="Bead console — work out what to file next">🧾</a>
      <a href="/sessions" class="icon-btn" aria-label="Current sessions — what every agent is on">🤖</a>
      <button id="refresh" class="icon-btn" aria-label="Refresh">⟳</button>
    </div>
  </header>

  <nav class="filters" id="filters" hidden></nav>

  <main id="list" class="list" aria-live="polite">
    <div class="empty" id="loading">Loading questions…</div>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <!--
    Settings. One setting, so it is a panel rather than a page: which slice of the
    tracker the inbox is. `human` is the app's premise — beads that are asking you
    something — but a workspace with none of them read as completely idle, so
    Climative showed 0 while 54 beads were open in it.
  -->
  <dialog id="settings-panel" class="setup">
    <h2>Show</h2>
    <nav class="scope" id="scope-toggle" role="group" aria-label="Which beads to list">
      <button data-scope="human" class="scope-btn">Human</button>
      <button data-scope="both" class="scope-btn">Both</button>
      <button data-scope="agent" class="scope-btn">Agent</button>
    </nav>
    <p id="scope-note"></p>
    <form method="dialog">
      <button value="close" class="primary">Done</button>
    </form>
  </dialog>

  <dialog id="setup" class="setup">
    <form method="dialog">
      <h2>Access token</h2>
      <p>Open this app from the link the server printed, or paste the token from
        <code>~/.config/beadcause/config.json</code>.</p>
      <input id="token-input" type="password" autocomplete="off" placeholder="token" inputmode="text">
      <button value="save" class="primary">Save</button>
    </form>
  </dialog>

  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/app.js"></script>
</body>
</html>
