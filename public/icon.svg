<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Beadcause">
  <!--
    "bdcz" — bd, the tool, over cz, the cause. Stacked two over two rather than set
    across one line: the letters are drawn at a fixed size, a 68 bowl on a 512 viewport,
    and four of them in a row would be 446 of ink against the 410 the maskable safe zone
    allows. Two lines of two fit with room. Nothing here is text: the letters are drawn
    as strokes so they render identically whatever fonts a phone has, and so the Android
    launcher vector (res/drawable/ic_launcher_foreground.xml) can be the same geometry
    rather than a second drawing.

    Both lines are centred on the viewport by their ink — 149..363 above, 156..356 below
    — and share one rhythm, 48 between letters, which is the gap b already had to d.

    The farthest ink is the ascenders: the stem tops at (164,149) and (348,149) are 141
    out from (256,256) and their round caps add 15, for 156. Everything is inside the
    maskable safe zone — the centre 80%, a circle of radius 205 about (256,256) — that
    icon-512.png's "any maskable" purpose asks for, with 49 to spare, so a circular mask
    takes nothing at all. The launcher's own guarantee is tighter and is met by a scale
    on the vector rather than here; see ic_launcher_foreground.xml.
  -->
  <rect width="512" height="512" rx="112" fill="#0b0f14"/>
  <g fill="none" stroke="#5eead4" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- bd: stem, bowl / bowl, stem — the two are mirrors of each other -->
    <path d="M164 149 V253"/>
    <circle cx="198" cy="219" r="34"/>
    <circle cx="314" cy="219" r="34"/>
    <path d="M348 149 V253"/>

    <!-- cz. The c is a bowl with 110° taken out of its right side, so it shares its
         radius with b and d and the mark keeps one rhythm. -->
    <path d="M224.5 301.15 A34 34 0 1 0 224.5 356.85"/>
    <path d="M287 295 H341 L287 363 H341"/>
  </g>
</svg>
