<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Beadcause">
  <!--
    "bdcoz" — bd, the tool, over coz, the cause. Stacked on two lines rather than set
    across one: five letters spanning the icon would each be under 10px on a 60px home
    screen, and two lines of two and three are roughly twice that. Nothing here is text:
    the letters are drawn as strokes so they render identically whatever fonts a phone
    has, and so the Android launcher vector (res/drawable/ic_launcher_foreground.xml)
    can be the same geometry rather than a second drawing.

    Everything lives inside the maskable safe zone — the centre 80%, a circle of radius
    205 about (256,256) — because icon-512.png is declared "any maskable" and Android
    crops to that circle. The farthest corner is the z's bottom right at (414,378),
    which is 199 out, so a circular mask takes the rounding and nothing else.
  -->
  <rect width="512" height="512" rx="112" fill="#0b0f14"/>
  <g fill="none" stroke="#5eead4" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- bd: stem, bowl / bowl, stem — the two are mirrors of each other -->
    <path d="M164 149 V253"/>
    <circle cx="198" cy="219" r="34"/>
    <circle cx="314" cy="219" r="34"/>
    <path d="M348 149 V253"/>

    <!-- coz. The c is an o with 110° taken out of its right side, so the two share a
         radius and the word keeps one rhythm. -->
    <path d="M166.5 301.15 A34 34 0 1 0 166.5 356.85"/>
    <circle cx="263" cy="329" r="34"/>
    <path d="M345 295 H399 L345 363 H399"/>
  </g>
</svg>
